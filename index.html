<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updating — back at 2:00 PM</title>
<style>
  :root {
    --ink: #14161a;
    --paper: #f7f6f3;
    --line: #d8d5cd;
    --accent: #2f5d50;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .mark {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.25;
    font-weight: 400;
    margin: 0 0 18px;
  }
  .rule {
    width: 48px;
    height: 1px;
    background: var(--line);
    margin: 28px auto;
  }
  .time {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    color: #55554f;
    letter-spacing: 0.02em;
  }
  .time strong {
    color: var(--ink);
    font-weight: 600;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Apex Finance</div>
    <h1>We're updating the site right now.</h1>
    <p class="time">Everything will be back at <strong>2:00 PM</strong>.<br>Thanks for your patience.</p>
    <div class="rule"></div>
    <p class="time">Questions in the meantime? <a href="mailto:amazoncloudservice@email.com" style="color: var(--accent);">support@yourdomain.example</a></p>
  </div>
</body>
</html>
